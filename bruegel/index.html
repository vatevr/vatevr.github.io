<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0603">
  <meta name="color-scheme" content="dark">
  <title>Bruegel daily — Netherlandish Proverbs</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preload" as="image" href="painting.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap">
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body data-state="loading">
  <div class="stage" id="stage">
    <div class="canvas" id="canvas" aria-label="Bruegel — Netherlandish Proverbs, 1559" role="img"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="reticle" id="reticle" aria-hidden="true"></div>
    <div class="hover-ring" id="hoverRing" aria-hidden="true"></div>
    <div class="tooltip" id="tooltip" role="tooltip" aria-hidden="true"></div>
  </div>

  <header class="topbar">
    <div class="pill">
      <button id="prev" class="icon" aria-label="Previous proverb">‹</button>
      <div class="meta">
        <span class="date" id="date"></span>
        <span class="sep">·</span>
        <span class="counter" id="counter"></span>
      </div>
      <button id="next" class="icon" aria-label="Next proverb">›</button>
    </div>
    <button id="todayBtn" class="today" aria-label="Today">today</button>
  </header>

  <aside class="card glass" id="card" data-mode="reveal">
    <button id="cardToggle" class="card-handle" aria-label="Collapse card"></button>

    <div class="card-body" id="cardBody">
      <div class="lang lang-ru">
        <span class="tag">RU</span>
        <p class="quote" id="ru-q"></p>
        <p class="analog" id="ru-a"></p>
      </div>
      <div class="lang lang-en">
        <span class="tag">EN</span>
        <p class="quote" id="en-q"></p>
        <p class="analog" id="en-a"></p>
      </div>
      <div class="lang lang-de">
        <span class="tag">DE</span>
        <p class="quote" id="de-q"></p>
        <p class="analog" id="de-a"></p>
      </div>
      <p class="meaning" id="meaning"></p>
    </div>

    <div class="card-body quiz-body" id="quizBody" hidden>
      <p class="prompt">which proverb does this image hide?</p>
      <ol class="options" id="options"></ol>
    </div>

    <div class="card-footer">
      <button id="quizToggle" class="action">test me</button>
      <button id="overviewToggle" class="action ghost" aria-pressed="false">explore the painting</button>
    </div>
  </aside>

  <div class="hint" id="hint" aria-hidden="true">hover or tap any part of the painting</div>

  <script src="app.js?v=9"></script>
</body>
</html>
